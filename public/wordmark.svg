<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1254" height="1254" viewBox="0 0 1254 1254" role="img"
     aria-labelledby="logo-title logo-description">
  <title id="logo-title">EVE Online MCP</title>
  <desc id="logo-description">A white orbital gateway surrounding three connected blue nodes.
    EVE ONLINE uses ordinary Arial Bold letterforms, outlined as vector paths.
    MCP appears below in blue geometric lettering. Dark background.</desc>
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feComponentTransfer in="blur" result="faint-glow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge><feMergeNode in="faint-glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="gate-quarter" d="M581 158 A298 298 0 0 0 332 407 L378 407 A253 253 0 0 1 581 204Z"/>
    <g id="gate-spoke">
      <path d="M602 119 L621 102 L621 269 L591 276 L591 227 L602 223Z"/>
      <path d="M634 102 L653 119 L653 223 L664 227 L664 276 L634 269Z"/>
    </g>
  </defs>
  <rect id="background" width="1254" height="1254" fill="#05080b"/>
  <g id="orbital-emblem" filter="url(#soft-glow)">
    <g id="outer-gateway" fill="#e7e9ec">
      <use xlink:href="#gate-quarter"/>
      <use xlink:href="#gate-quarter" transform="rotate(90 627 452)"/>
      <use xlink:href="#gate-quarter" transform="rotate(180 627 452)"/>
      <use xlink:href="#gate-quarter" transform="rotate(270 627 452)"/>
      <use xlink:href="#gate-spoke"/>
      <use xlink:href="#gate-spoke" transform="rotate(90 627 452)"/>
      <use xlink:href="#gate-spoke" transform="rotate(180 627 452)"/>
      <use xlink:href="#gate-spoke" transform="rotate(270 627 452)"/>
    </g>
    <g id="inner-orbit" fill="none" stroke="#91bbdc" stroke-width="10">
      <path d="M472 457 A156 156 0 0 1 574 301"/>
      <path d="M680 301 A156 156 0 0 1 782 457"/>
      <path d="M519 560 A156 156 0 0 0 574 594"/>
      <path d="M680 594 A156 156 0 0 0 735 560"/>
    </g>
    <g id="connected-nodes" fill="#91bbdc" stroke="#91bbdc">
      <path d="M627 359 L535 503 H719Z" fill="none" stroke-width="13" stroke-linejoin="round"/>
      <circle cx="627" cy="359" r="44" stroke="none"/>
      <circle cx="535" cy="503" r="44" stroke="none"/>
      <circle cx="719" cy="503" r="44" stroke="none"/>
    </g>
  </g>
